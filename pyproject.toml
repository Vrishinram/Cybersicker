[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersicker"
version = "2.0.0"
description = "Autonomous LLM-Powered Security Operations Center for IoT Threat Detection & Response"
readme = "README.md"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
